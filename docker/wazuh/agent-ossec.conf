<!--
  Wazuh agent configuration for edr-bench victim-linux.
  Deployed at runtime when WAZUH_AGENT_ENABLED=true.
  WAZUH_MANAGER_IP is replaced by entrypoint.sh with the actual IP.
-->
<ossec_config>
  <client>
    <server>
      <address>WAZUH_MANAGER_IP</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>WAZUH_MANAGER_IP</manager_address>
      <port>1515</port>
    </enrollment>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
  </client>

  <!-- Syscheck: File Integrity Monitoring (realtime) -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>30</frequency>
    <scan_on_start>yes</scan_on_start>

    <directories realtime="yes" check_all="yes">/etc</directories>
    <directories realtime="yes" check_all="yes">/usr/bin,/usr/sbin</directories>
    <directories realtime="yes" check_all="yes">/home/user</directories>
    <directories realtime="yes" check_all="yes">/tmp</directories>
    <directories realtime="yes" check_all="yes">/media/usb0</directories>
    <directories realtime="yes" check_all="yes">/var/spool/cron</directories>

    <ignore>/etc/mtab</ignore>
    <ignore>/etc/adjtime</ignore>
    <ignore>/etc/random-seed</ignore>
    <ignore>/etc/prelink.cache</ignore>
  </syscheck>

  <!-- Audit log collection (requires auditd) -->
  <localfile>
    <log_format>audit</log_format>
    <location>/var/log/audit/audit.log</location>
  </localfile>

  <!-- Syslog collection -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <!-- Command monitoring -->
  <localfile>
    <log_format>command</log_format>
    <command>netstat -tulpn 2>/dev/null || ss -tulpn</command>
    <frequency>120</frequency>
  </localfile>

  <localfile>
    <log_format>full_command</log_format>
    <command>last -n 20</command>
    <frequency>120</frequency>
  </localfile>

  <!-- Active response -->
  <active-response>
    <disabled>no</disabled>
  </active-response>

  <!-- Rootcheck -->
  <rootcheck>
    <disabled>no</disabled>
    <frequency>3600</frequency>
  </rootcheck>
</ossec_config>
