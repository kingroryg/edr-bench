[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:vncserver]
command=Xvnc :1 -geometry 1920x1080 -depth 24 -rfbport 5900 -rfbauth /root/.vnc/passwd -pn
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/vncserver.log
stderr_logfile=/var/log/supervisor/vncserver_err.log

[program:xfce4]
command=startxfce4
environment=DISPLAY=":1",HOME="/root",USER="root"
autorestart=true
priority=15
startsecs=5
stdout_logfile=/var/log/supervisor/xfce4.log
stderr_logfile=/var/log/supervisor/xfce4_err.log

[program:novnc]
command=websockify --web /usr/share/novnc 6080 localhost:5900
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc_err.log

[program:cupsd]
command=/usr/sbin/cupsd -f
autorestart=true
priority=25
stdout_logfile=/var/log/supervisor/cupsd.log
stderr_logfile=/var/log/supervisor/cupsd_err.log
