[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:vncserver]
command=Xvnc :1 -geometry 1920x1080 -depth 24 -rfbport 5900 -rfbauth /root/.vnc/passwd -pn
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/vncserver.log
stderr_logfile=/var/log/supervisor/vncserver_err.log

[program:xfce4]
command=startxfce4
environment=DISPLAY=":1",HOME="/root",USER="root"
autorestart=true
priority=15
startsecs=5
stdout_logfile=/var/log/supervisor/xfce4.log
stderr_logfile=/var/log/supervisor/xfce4_err.log

[program:novnc]
command=websockify --web /usr/share/novnc 6080 localhost:5900
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc_err.log

[program:cupsd]
command=/usr/sbin/cupsd -f
autorestart=true
priority=25
stdout_logfile=/var/log/supervisor/cupsd.log
stderr_logfile=/var/log/supervisor/cupsd_err.log

[program:cups-pdf-setup]
command=/bin/bash -c "sleep 5; lpstat -p PDF 2>/dev/null || lpadmin -p PDF -v cups-pdf:/ -E -m lsb/usr/cups-pdf/CUPS-PDF_opt.ppd 2>/dev/null || lpadmin -p PDF -v cups-pdf:/ -E -m raw; exit 0"
autostart=true
autorestart=false
startsecs=0
priority=26
stdout_logfile=/var/log/supervisor/cups-pdf-setup.log
stderr_logfile=/var/log/supervisor/cups-pdf-setup_err.log

[program:wazuh-agent]
command=/var/ossec/bin/wazuh-control start
autostart=false
autorestart=false
priority=30
stdout_logfile=/var/log/supervisor/wazuh-agent.log
stderr_logfile=/var/log/supervisor/wazuh-agent_err.log
