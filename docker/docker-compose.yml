services:
  victim-linux:
    build:
      context: ./victim-linux
    profiles: [linux, full]
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - AUDIT_CONTROL
      - AUDIT_WRITE
    ports:
      - "5900:5900"
      - "6080:6080"
    networks:
      edr-bench-net:
        ipv4_address: 172.28.1.10
    env_file:
      - ../.env
    environment:
      - VNC_PASSWORD=${VNC_PASSWORD:-changeme}
      - DISPLAY=:1
      - HTTP_PROXY=http://172.28.2.20:8080
      - HTTPS_PROXY=http://172.28.2.20:8080
      - NO_PROXY=localhost,127.0.0.1
      - WAZUH_MANAGER_IP=${WAZUH_MANAGER_IP:-172.28.6.10}
    depends_on:
      mocknet:
        condition: service_healthy
    dns: 172.28.2.10
    volumes:
      - /var/log/edr:/var/log/edr
      - ../data/fixtures:/home/user/fixtures:ro
      - usb-sim:/media/usb0
      - ./wazuh/agent-ossec.conf:/opt/wazuh-agent-ossec.conf:ro
    mem_limit: 4g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6080"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  victim-windows:
    build:
      context: ./victim-windows
    profiles: [windows, full]
    restart: unless-stopped
    networks:
      edr-bench-net:
        ipv4_address: 172.28.1.20
    mem_limit: 4g
    cpus: 2.0
    depends_on:
      mocknet:
        condition: service_healthy

  mocknet:
    build:
      context: ./mocknet
      args:
        MOCKNET_SSH_PASSWORD: ${MOCKNET_SSH_PASSWORD:-changeme}
    profiles: [linux, windows, full]
    restart: unless-stopped
    networks:
      edr-bench-net:
        ipv4_address: 172.28.2.10
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../data/fixtures:/var/www/fixtures:ro
      - mocknet-logs:/var/log/mocknet
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  mitmproxy:
    build:
      context: ./mitmproxy
    profiles: [linux, windows, full]
    restart: unless-stopped
    networks:
      edr-bench-net:
        ipv4_address: 172.28.2.20
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./mitmproxy/flows:/flows
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  tracee:
    image: aquasec/tracee:0.22.0
    profiles: [linux, full]
    restart: unless-stopped
    privileged: true
    pid: host
    volumes:
      - /etc/os-release:/etc/os-release-host:ro
      - /boot:/boot:ro
      - /usr/src:/usr/src:ro
      - /lib/modules:/lib/modules:ro
      - tracee-output:/tmp/tracee
    networks:
      edr-bench-net:
        ipv4_address: 172.28.3.10
    mem_limit: 1g
    cpus: 1.0
    command: --output json --output option:parse-arguments --filter container --output file:/tmp/tracee/out/events.json

  controller:
    build:
      context: ..
      dockerfile: docker/controller/Dockerfile
    profiles: [linux, windows, cloud, phishing, full]
    restart: unless-stopped
    networks:
      edr-bench-net:
        ipv4_address: 172.28.0.10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - mocknet-logs:/var/log/mocknet:ro
      - ../data:/app/data:ro
      - ./mitmproxy/flows:/flows:ro
      - tracee-output:/tmp/tracee:ro
      - wazuh-alerts:/var/log/wazuh-logs:ro
      - falco-output:/var/log/falco:ro
    env_file:
      - ../.env
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "python3", "-c", "import docker; docker.from_env().ping()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  localstack:
    image: localstack/localstack:3.8.1
    profiles: [cloud, full]
    restart: unless-stopped
    networks:
      edr-bench-net:
        ipv4_address: 172.28.4.10
    ports:
      - "4566:4566"
    volumes:
      - ./localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  gophish:
    build:
      context: ./gophish
    profiles: [phishing, full]
    restart: unless-stopped
    networks:
      edr-bench-net:
        ipv4_address: 172.28.5.10
    ports:
      - "3333:3333"
      - "8888:80"
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:3333"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  wazuh-manager:
    image: wazuh/wazuh-manager:4.14.3
    profiles: [wazuh, full]
    restart: unless-stopped
    networks:
      edr-bench-net:
        ipv4_address: 172.28.6.10
    ports:
      - "55000:55000"
      - "1514:1514"
      - "1515:1515"
    environment:
      - INDEXER_URL=https://127.0.0.1:9200
      - FILEBEAT_SSL_VERIFICATION_MODE=none
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${WAZUH_API_PASSWORD:-Edr.Bench!2024xQ9mK}
    volumes:
      - wazuh-alerts:/var/ossec/logs
      - ./wazuh/local_rules.xml:/var/ossec/etc/rules/local_rules.xml:ro
      - ./wazuh-alerts:/var/ossec/logs/alerts
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "/var/ossec/bin/wazuh-control status | grep -q 'wazuh-analysisd is running'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  falco:
    image: falcosecurity/falco:0.39.2
    profiles: [falco, full]
    restart: unless-stopped
    privileged: true
    pid: host
    volumes:
      - /dev:/host/dev:ro
      - /proc:/host/proc:ro
      - /boot:/boot:ro
      - /lib/modules:/lib/modules:ro
      - /usr/src:/usr/src:ro
      - falco-output:/var/log/falco
      - ./falco/falco.yaml:/etc/falco/falco.yaml:ro
      - ./falco/custom_rules.yaml:/etc/falco/rules.d/custom_rules.yaml:ro
    networks:
      edr-bench-net:
        ipv4_address: 172.28.6.20
    mem_limit: 1g
    cpus: 1.0
    command:
      - /usr/bin/falco
      - --option=json_output=true
      - --option=file_output.enabled=true
      - --option=file_output.filename=/var/log/falco/events.json

volumes:
  usb-sim:
    driver: local
  mocknet-logs:
    driver: local
  tracee-output:
    driver: local
  wazuh-alerts:
    driver: local
  falco-output:
    driver: local

networks:
  edr-bench-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
