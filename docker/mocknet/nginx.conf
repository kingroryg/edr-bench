    # GitHub: proxy git HTTP protocol to Flask for ground truth logging
    server {
        listen 80;
        server_name github.com www.github.com;

        root /var/www/github.com;
        index index.html;

        # Git smart HTTP protocol (push/pull)
        location ~ \.git {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            client_max_body_size 100m;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }

