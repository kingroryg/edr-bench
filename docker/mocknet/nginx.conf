worker_processes auto;
pid /run/nginx.pid;
daemon off;

events {
    worker_connections 512;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    sendfile on;
    keepalive_timeout 65;

    # chatgpt.com
    server {
        listen 80;
        server_name chatgpt.com www.chatgpt.com;

        root /var/www/chatgpt.com;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # salesforce.com
    server {
        listen 80;
        server_name salesforce.com www.salesforce.com login.salesforce.com;

        root /var/www/salesforce.com;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # github.com
    server {
        listen 80;
        server_name github.com www.github.com;

        root /var/www/github.com;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # Default server (catch-all)
    server {
        listen 80 default_server;
        server_name _;

        location /api/ {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            return 404 "Not found";
        }
    }
}
