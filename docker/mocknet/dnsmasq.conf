# Job search and professional networking for insider threat scenarios
address=/linkedin.com/172.28.2.10
address=/www.linkedin.com/172.28.2.10
address=/indeed.com/172.28.2.10

# Mock enterprise services for phishing and auth scenarios
address=/banking.example.com/172.28.2.10
address=/okta.example.com/172.28.2.10
address=/zendesk.example.com/172.28.2.10
address=/freshdesk.example.com/172.28.2.10

# Video conferencing for social engineering scenarios
address=/zoom.us/172.28.2.10

# Phishing landing pages for credential harvesting campaigns
address=/phishing.example.com/172.28.2.10
address=/login.company-secure.xyz/172.28.2.10

# File transfer for exfiltration scenarios
address=/webtransfer.com/172.28.2.10

# AWS endpoint simulation (routed to localstack via mocknet)
address=/amazonaws.com/172.28.2.10

# C2 simulation domain
address=/c2.evil.com/172.28.2.10

# Do not use /etc/resolv.conf
no-resolv

# Listen on all interfaces
listen-address=0.0.0.0

# Log queries for debugging
log-queries
log-facility=/var/log/mocknet/dnsmasq.log

# Upstream DNS for anything not overridden
server=8.8.8.8
server=8.8.4.4
