address=/mail.google.com/172.28.2.10
address=/gmail.com/172.28.2.10
address=/accounts.google.com/172.28.2.10
address=/chrome.google.com/172.28.2.10

# Messaging platforms for data exfiltration scenarios
address=/slack.com/172.28.2.10
address=/web.whatsapp.com/172.28.2.10
address=/telegram.org/172.28.2.10
address=/web.telegram.org/172.28.2.10
