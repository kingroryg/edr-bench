# dnsmasq configuration for mocknet
# Resolve fake domains to the mocknet container IP

# Web service domains
address=/chatgpt.com/172.28.2.10
address=/salesforce.com/172.28.2.10
address=/github.com/172.28.2.10

# AWS endpoint simulation (routed to localstack via mocknet)
address=/amazonaws.com/172.28.2.10

# C2 simulation domain
address=/c2.evil.com/172.28.2.10

# Do not use /etc/resolv.conf
no-resolv

# Listen on all interfaces
listen-address=0.0.0.0

# Log queries for debugging
log-queries
log-facility=/var/log/mocknet/dnsmasq.log

# Upstream DNS for anything not overridden
server=8.8.8.8
server=8.8.4.4
