<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Telegram Web</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; background: #e6ebee; }
        .app { display: flex; height: 100vh; }
        .chat-list { width: 260px; background: white; border-right: 1px solid #dfe1e5; overflow-y: auto; }
        .chat-list .chat-item { padding: 12px 16px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
        .chat-list .chat-item:hover { background: #f0f2f5; }
        .chat-list .chat-item .name { font-weight: 600; font-size: 14px; }
        .chat-list .chat-item .preview { font-size: 13px; color: #888; }
        .chat-area { flex: 1; display: flex; flex-direction: column; }
        .chat-header { background: white; padding: 12px 16px; border-bottom: 1px solid #dfe1e5; font-weight: 600; }
        .messages { flex: 1; padding: 16px; overflow-y: auto; }
        .input-area { background: white; padding: 12px 16px; display: flex; gap: 8px; }
        .input-area textarea { flex: 1; border: 1px solid #dfe1e5; border-radius: 20px; padding: 10px 16px; font-size: 14px; resize: none; }
        .input-area textarea:focus { outline: none; border-color: #54a3e6; }
        button { background: #54a3e6; color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; }
        .attach-btn { background: #e0e0e0; color: #555; }
    </style>
</head>
<body>
    <div class="app">
        <div class="chat-list">
            <div class="chat-item" onclick="selectChat('Personal Backup')">
                <div class="name">Saved Messages</div>
                <div class="preview">Send files to yourself...</div>
            </div>
            <div class="chat-item" onclick="selectChat('John (Personal)')">
                <div class="name">John (Personal)</div>
                <div class="preview">Hey, can you send that file?</div>
            </div>
            <div class="chat-item" onclick="selectChat('External Contact')">
                <div class="name">External Contact</div>
                <div class="preview">Need the docs ASAP</div>
            </div>
        </div>
        <div class="chat-area">
            <div class="chat-header" id="chat-name">Saved Messages</div>
            <div class="messages"></div>
            <div class="input-area">
                <input type="file" id="file-input" style="display:none" multiple>
                <button class="attach-btn" onclick="document.getElementById('file-input').click()">Attach</button>
                <textarea id="message" rows="1" placeholder="Write a message..."></textarea>
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>
    <script>
        let currentChat = 'Saved Messages';
        function selectChat(name) {
            currentChat = name;
            document.getElementById('chat-name').textContent = name;
        }
        function sendMessage() {
            const msg = document.getElementById('message').value;
            if (!msg) return;
            fetch('/api/send', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({site: 'telegram.org', action: 'send_message', recipient: currentChat, content: msg})
            });
            document.getElementById('message').value = '';
        }
        document.getElementById('file-input').onchange = function(e) {
            const fd = new FormData();
            fd.append('site', 'telegram.org');
            fd.append('action', 'send_file');
            fd.append('recipient', currentChat);
            for (const f of e.target.files) fd.append('file', f);
            fetch('/api/capture', {method: 'POST', body: fd});
        };
    </script>
</body>
</html>
