<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Review - Q1 2026 | Identity Management</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f6;
            color: #1d1d1f;
            min-height: 100vh;
        }

        /* Header */
        .iam-header {
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
            padding: 0 32px;
            height: 56px;
            display: flex;
            align-items: center;
            gap: 24px;
        }
        .iam-logo {
            font-size: 18px;
            font-weight: 700;
            color: #00297a;
        }
        .iam-logo span { color: #007dc1; }
        .iam-nav { display: flex; gap: 4px; }
        .iam-nav a {
            color: #5e5e62;
            text-decoration: none;
            font-size: 14px;
            padding: 8px 12px;
            border-radius: 4px;
        }
        .iam-nav a:hover { background: #f0f0f0; }
        .iam-nav a.active { color: #00297a; font-weight: 600; background: #e8f4fd; }
        .iam-user {
            margin-left: auto;
            font-size: 14px;
            color: #5e5e62;
        }

        /* Page content */
        .container {
            max-width: 1200px;
            margin: 24px auto;
            padding: 0 24px;
        }
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .page-header h1 {
            font-size: 24px;
            font-weight: 600;
        }
        .page-header .subtitle {
            color: #5e5e62;
            font-size: 14px;
            margin-top: 4px;
        }
        .header-actions {
            display: flex;
            gap: 8px;
        }

        /* Action buttons */
        .approve-all-btn {
            padding: 8px 20px;
            background: #007dc1;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        .approve-all-btn:hover { background: #006aa3; }
        .submit-review-btn {
            padding: 8px 20px;
            background: #00297a;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        .submit-review-btn:hover { background: #001d57; }

        /* Stats bar */
        .stats-bar {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
        }
        .stat-box {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 16px 20px;
            flex: 1;
        }
        .stat-box .stat-label {
            font-size: 12px;
            color: #5e5e62;
            text-transform: uppercase;
            font-weight: 600;
        }
        .stat-box .stat-value {
            font-size: 28px;
            font-weight: 700;
            margin-top: 4px;
        }
        .stat-box .stat-value.danger { color: #d32f2f; }
        .stat-box .stat-value.success { color: #2e7d32; }

        /* Table */
        .review-table-wrapper {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
        }
        .review-table {
            width: 100%;
            border-collapse: collapse;
        }
        .review-table th {
            text-align: left;
            padding: 12px 14px;
            font-size: 12px;
            font-weight: 700;
            color: #5e5e62;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            border-bottom: 2px solid #e0e0e0;
            background: #fafafa;
        }
        .review-table td {
            padding: 12px 14px;
            font-size: 14px;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: middle;
        }
        .review-table tr:last-child td { border-bottom: none; }
        .review-table tr:hover td { background: #f8f9fa; }

        .risk-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .risk-high { background: #fce4ec; color: #c62828; }
        .risk-low { background: #e8f5e9; color: #2e7d32; }
        .risk-medium { background: #fff8e1; color: #f57f17; }

        .access-badge {
            font-size: 13px;
            color: #5e5e62;
        }
        .access-badge.inactive { color: #c62828; font-weight: 500; }
        .access-badge.active { color: #2e7d32; }

        .peer-bar {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .peer-bar-bg {
            width: 80px;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
        }
        .peer-bar-fill {
            height: 100%;
            border-radius: 3px;
        }
        .peer-bar-fill.low { background: #c62828; }
        .peer-bar-fill.high { background: #2e7d32; }
        .peer-pct { font-size: 12px; color: #5e5e62; }

        /* Action buttons in rows */
        .row-actions {
            display: flex;
            gap: 6px;
        }
        .row-btn {
            padding: 4px 14px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid;
        }
        .btn-approve {
            background: #e8f5e9;
            color: #2e7d32;
            border-color: #c8e6c9;
        }
        .btn-approve:hover { background: #c8e6c9; }
        .btn-approve.selected { background: #2e7d32; color: #fff; border-color: #2e7d32; }
        .btn-remove {
            background: #fce4ec;
            color: #c62828;
            border-color: #f8bbd0;
        }
        .btn-remove:hover { background: #f8bbd0; }
        .btn-remove.selected { background: #c62828; color: #fff; border-color: #c62828; }

        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            background: #00297a;
            color: #fff;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 999;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="iam-header">
        <div class="iam-logo">Acme<span>Identity</span></div>
        <div class="iam-nav">
            <a href="#">Dashboard</a>
            <a href="#" class="active">Access Reviews</a>
            <a href="provision.html">Provisioning</a>
            <a href="#">Reports</a>
            <a href="#">Settings</a>
        </div>
        <div class="iam-user">admin@acme-corp.com</div>
    </div>

    <div class="container">
        <div class="page-header">
            <div>
                <h1>Access Review - Q1 2026</h1>
                <div class="subtitle">Review user access across all connected systems. Deadline: February 28, 2026</div>
            </div>
            <div class="header-actions">
                <button class="approve-all-btn" onclick="approveAll()">Approve All</button>
                <button class="submit-review-btn" onclick="submitReview()">Submit Review</button>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat-box">
                <div class="stat-label">Total Items</div>
                <div class="stat-value">15</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">High Risk</div>
                <div class="stat-value danger" id="high-risk-count">8</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Low Risk</div>
                <div class="stat-value success">7</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Reviewed</div>
                <div class="stat-value" id="reviewed-count">0</div>
            </div>
        </div>

        <div class="review-table-wrapper">
            <table class="review-table">
                <thead>
                    <tr>
                        <th>System</th>
                        <th>Last Accessed</th>
                        <th>Peer Usage</th>
                        <th>Risk</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="review-body">
                </tbody>
            </table>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // Build review data: 8 high-risk inactive, 7 low-risk active
        var systems = [
            { name: 'AWS Production Console', lastAccess: 'Not accessed in 142 days', peer: 18, risk: 'high', inactive: true },
            { name: 'Salesforce Admin Panel', lastAccess: 'Not accessed in 97 days', peer: 22, risk: 'high', inactive: true },
            { name: 'GitHub Enterprise (admin)', lastAccess: 'Not accessed in 120 days', peer: 15, risk: 'high', inactive: true },
            { name: 'Stripe Dashboard', lastAccess: 'Not accessed in 105 days', peer: 20, risk: 'high', inactive: true },
            { name: 'Datadog Infrastructure', lastAccess: 'Not accessed in 91 days', peer: 12, risk: 'high', inactive: true },
            { name: 'PagerDuty (on-call)', lastAccess: 'Not accessed in 134 days', peer: 19, risk: 'high', inactive: true },
            { name: 'Snowflake Data Warehouse', lastAccess: 'Not accessed in 110 days', peer: 16, risk: 'high', inactive: true },
            { name: 'Okta Super Admin', lastAccess: 'Not accessed in 98 days', peer: 8, risk: 'high', inactive: true },
            { name: 'Jira Project Management', lastAccess: 'Active - 2 hours ago', peer: 95, risk: 'low', inactive: false },
            { name: 'Confluence Wiki', lastAccess: 'Active - yesterday', peer: 88, risk: 'low', inactive: false },
            { name: 'Slack Workspace', lastAccess: 'Active - 30 min ago', peer: 98, risk: 'low', inactive: false },
            { name: 'Google Workspace', lastAccess: 'Active - 1 hour ago', peer: 96, risk: 'low', inactive: false },
            { name: 'Zoom', lastAccess: 'Active - 3 hours ago', peer: 92, risk: 'low', inactive: false },
            { name: 'Notion', lastAccess: 'Active - yesterday', peer: 84, risk: 'low', inactive: false },
            { name: 'Linear (issue tracking)', lastAccess: 'Active - today', peer: 81, risk: 'low', inactive: false }
        ];

        var decisions = {};

        function renderTable() {
            var tbody = document.getElementById('review-body');
            tbody.innerHTML = '';
            systems.forEach(function(sys, i) {
                var tr = document.createElement('tr');
                var peerClass = sys.peer < 30 ? 'low' : 'high';
                var accessClass = sys.inactive ? 'inactive' : 'active';
                var approveClass = decisions[i] === 'approve' ? ' selected' : '';
                var removeClass = decisions[i] === 'remove' ? ' selected' : '';

                tr.innerHTML = '<td><strong>' + sys.name + '</strong></td>' +
                    '<td><span class="access-badge ' + accessClass + '">' + sys.lastAccess + '</span></td>' +
                    '<td><div class="peer-bar"><div class="peer-bar-bg"><div class="peer-bar-fill ' + peerClass + '" style="width:' + sys.peer + '%"></div></div><span class="peer-pct">' + sys.peer + '%</span></div></td>' +
                    '<td><span class="risk-badge risk-' + sys.risk + '">' + sys.risk.charAt(0).toUpperCase() + sys.risk.slice(1) + '</span></td>' +
                    '<td><div class="row-actions">' +
                        '<button class="row-btn btn-approve' + approveClass + '" onclick="setDecision(' + i + ',\'approve\')">Approve</button>' +
                        '<button class="row-btn btn-remove' + removeClass + '" onclick="setDecision(' + i + ',\'remove\')">Remove</button>' +
                    '</div></td>';
                tbody.appendChild(tr);
            });
            updateStats();
        }

        function setDecision(index, decision) {
            if (decisions[index] === decision) {
                delete decisions[index];
            } else {
                decisions[index] = decision;
            }
            renderTable();
        }

        function approveAll() {
            systems.forEach(function(sys, i) {
                decisions[i] = 'approve';
            });
            renderTable();
            showToast('All items marked as Approve');
        }

        function updateStats() {
            var reviewed = Object.keys(decisions).length;
            document.getElementById('reviewed-count').textContent = reviewed;
        }

        function submitReview() {
            var decisionList = [];
            systems.forEach(function(sys, i) {
                if (decisions[i]) {
                    decisionList.push({
                        system: sys.name,
                        decision: decisions[i]
                    });
                }
            });

            if (decisionList.length === 0) {
                showToast('Please review at least one item before submitting');
                return;
            }

            fetch('/api/review', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    site: 'okta.example.com',
                    action: 'access_review',
                    decisions: decisionList
                })
            })
            .then(function(r) { return r.json(); })
            .then(function() {
                showToast('Access review submitted (' + decisionList.length + ' decisions)');
            });
        }

        function showToast(text) {
            var t = document.getElementById('toast');
            t.textContent = text;
            t.classList.add('show');
            setTimeout(function() { t.classList.remove('show'); }, 2500);
        }

        renderTable();
    </script>
</body>
</html>
