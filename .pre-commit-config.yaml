repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.0
          - pydantic-settings>=2.0
          - typer>=0.9
          - rich>=13.0
          - structlog>=24.0
          - httpx>=0.27
          - docker>=7.0
          - numpy>=1.26
          - tenacity>=8.0
          - jinja2>=3.1
        args: [--python-version=3.11]
