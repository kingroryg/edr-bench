[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edr-bench"
version = "0.1.0"
description = "Sandboxed benchmarking suite for evaluating AI-enhanced EDR tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "docker>=7.0",
    "httpx>=0.27",
    "structlog>=24.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "anthropic>=0.42",
    "openai>=1.50",
    "asyncvnc>=1.1",
    "tenacity>=8.0",
    "mitmproxy>=10.0",
    "pillow>=10.0",
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
edr-bench = "edr_bench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/edr_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests (require Docker)",
]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
