name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: acme-corp/platform-api

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run linting
        run: |
          ruff check src/
          mypy src/

      - name: Run tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
        run: pytest tests/ -v --cov=src --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build and Push Image
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build-push.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # BUG: This debug step accidentally prints secrets to the workflow log.
      # An attacker with read access to Actions logs could extract these values.
      - name: Debug environment (INSECURE - remove before production)
        run: |
          echo "Deploying image: ${{ needs.build.outputs.image-tag }}"
          echo "Database URL: $DATABASE_URL"
          echo "Redis URL: $REDIS_URL"
          echo "API Secret: $API_SECRET_KEY"
          echo "Stripe Key: $STRIPE_SECRET_KEY"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

      # This step correctly uses secrets without exposing them in logs
      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster acme-prod \
            --service platform-api \
            --force-new-deployment \
            --task-definition platform-api-prod
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}

      - name: Run database migrations
        run: |
          aws ecs run-task \
            --cluster acme-prod \
            --task-definition platform-api-migrate \
            --overrides '{
              "containerOverrides": [{
                "name": "migrate",
                "environment": [
                  {"name": "DATABASE_URL", "value": "${{ secrets.DATABASE_URL }}"},
                  {"name": "MIGRATION_MODE", "value": "apply"}
                ]
              }]
            }'

      - name: Wait for deployment to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster acme-prod \
            --services platform-api
          echo "Deployment stable"

      - name: Run smoke tests
        run: |
          curl -sf https://api.acmeplatform.com/health || exit 1
          curl -sf https://api.acmeplatform.com/ready || exit 1
          echo "Smoke tests passed"

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "Deployment ${{ job.status }}: ${{ github.sha }} to production",
              "channel": "#deployments"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
