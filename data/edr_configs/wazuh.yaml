# Wazuh EDR configuration for edr-bench
# Wazuh alerts are written as JSON by the wazuh-manager to a shared volume.

type: file_tailer
log_path: /var/log/wazuh-logs/alerts/alerts.json
format: json
edr_name: Wazuh

# Wazuh JSON alerts are deeply nested; the WazuhNormalizer flattens them
# automatically, so no explicit field_mapping is needed here.

# Wazuh severity is numeric (0-15); the WazuhNormalizer handles the mapping:
#   0-3  -> info
#   4-6  -> low
#   7-9  -> medium
#   10-12 -> high
#   13-15 -> critical
